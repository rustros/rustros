# Native modules for RustROS (separate workspace: position-independent code,
# unlike the kernel). Built by `make modules`; each module is a static-pie
# ELF whose entry point is rustros_module_init.
[workspace]
members = ["support", "echo", "crashy", "httpd", "shell", "nat", "l2tp", "router", "cake", "wasm", "webadmin", "wireguard", "proxy", "anytls", "panel", "sites", "ext4", "boot"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

# The WebAssembly interpreter is big: optimise it for size (a module is at
# most 1 MiB).
[profile.release.package.wasmi]
opt-level = "z"
[profile.release.package.wasmi_core]
opt-level = "z"
[profile.release.package.wasmi_ir]
opt-level = "z"
[profile.release.package.wasmparser]
opt-level = "z"

# TLS (shell's curl): handshakes are rare, optimise for size
[profile.release.package.rustls]
opt-level = "z"
[profile.release.package.rustls-webpki]
opt-level = "z"
[profile.release.package.webpki-roots]
opt-level = "z"
[profile.release.package.rsa]
opt-level = "z"
[profile.release.package.num-bigint-dig]
opt-level = "z"
[profile.release.package.p256]
opt-level = "z"
[profile.release.package.p384]
opt-level = "z"
[profile.release.package.primeorder]
opt-level = "z"
[profile.release.package.elliptic-curve]
opt-level = "z"
[profile.release.package.ecdsa]
opt-level = "z"
[profile.release.package.der]
opt-level = "z"
[profile.release.package.spki]
opt-level = "z"
[profile.release.package.pkcs1]
opt-level = "z"
[profile.release.package.pkcs8]
opt-level = "z"
[profile.release.package.tls]
opt-level = "z"
[profile.release.package.wg-core]
opt-level = 3

# Logic that is not on the data path, and handshake-only crypto: for size
# (apps carrying TLS come close to the 1 MiB a module may be)
[profile.release.package.sites]
opt-level = "z"
[profile.release.package.panel]
opt-level = "z"
[profile.release.package.httpc]
opt-level = "z"
[profile.release.package.shell]
opt-level = "z"
[profile.release.package.curve25519-dalek]
opt-level = "z"
[profile.release.package.ed25519-dalek]
opt-level = "z"
[profile.release.package.x25519-dalek]
opt-level = "z"
[profile.release.package.crypto-bigint]
opt-level = "z"
[profile.release.package.signature]
opt-level = "z"
[profile.release.package.base16ct]
opt-level = "z"
[profile.release.package.rustros-util]
opt-level = "s"

# the boot module (with the kernel in its slot): optimised for size
[profile.release.package.updater]
opt-level = "z"
[profile.release.package.rescue]
opt-level = "z"
[profile.release.package.dhcp]
opt-level = "z"
[profile.release.package.boot-mod]
opt-level = "z"
# the boot module's storage service (cold paths, like in the kernel before)
[profile.release.package.storage]
opt-level = "z"
[profile.release.package.kvstore]
opt-level = "z"
[profile.release.package.slots]
opt-level = "z"
[profile.release.package.virtio]
opt-level = 3
# the boot module's network stack: the data path, as in the kernel before
[profile.release.package.netstack]
opt-level = 3
