# Native modules for RustROS (separate workspace: position-independent code,
# unlike the kernel). Built by `make modules`; each module is a static-pie
# ELF whose entry point is rustros_module_init.
[workspace]
members = ["support", "echo", "crashy", "httpd", "shell", "nat", "l2tp", "router", "cake", "wasm", "webadmin"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

# The WebAssembly interpreter is big: optimise it for size (a module is at
# most 1 MiB).
[profile.release.package.wasmi]
opt-level = "z"
[profile.release.package.wasmi_core]
opt-level = "z"
[profile.release.package.wasmi_ir]
opt-level = "z"
[profile.release.package.wasmparser]
opt-level = "z"
